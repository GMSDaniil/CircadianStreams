# Long scenario for Experiment B (CWT-vs-Cosinor detection latency).
#
# Sized for the real 5-day CWT window: ~7 days of clean baseline let the sliding window fill with healthy data, then a gradual HR/ABP_SYS amplitude flattening from day 7 (a KNOWN onset) sustained
# to the end, so the window travels across the onset and both methods can be timed against it.
name: amplitude_decay_long
description: 14 days; HR+ABP_SYS amplitude flattening from day 7 (detection-latency experiment).
patients: 4
simHours: 336
rateHz: 0.1
fidelity:
  noiseCorrelation: 0.8
  artifactRate: 0.001
disruptions:
  - patients: [all]
    signals: [HR, ABP_SYS]
    type: amplitude_drop
    startHour: 168      # onset at day 7
    endHour: 336
    magnitude: 0.25     # flatten to 25% of baseline amplitude
    rampHours: 24       # gradual onset over ~1 day
